<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reservas</title>
  <style>
    :root {
      --bg: #f7f3ee;
      --card: #ffffff;
      --text: #2b2420;
      --muted: #7a6e66;
      --accent: #b5452b;
      --accent-dark: #933720;
      --border: #e6ddd4;
      --error: #b00020;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 680px;
      margin: 0 auto;
      padding: 2.5rem 1rem;
      line-height: 1.5;
    }

    header { text-align: center; margin-bottom: 2rem; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.2rem;
      margin: 0;
    }
    header p { color: var(--muted); margin: .25rem 0 0; }

    h2 {
      font-size: 1.1rem;
      margin: 0 0 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      margin-bottom: 1.5rem;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    label {
      display: grid;
      gap: .3rem;
      font-size: .875rem;
      font-weight: 600;
      color: var(--muted);
    }
    .full { grid-column: 1 / -1; }

    input {
      padding: .65rem .75rem;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fdfbf9;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(181, 69, 43, .15);
    }

    button {
      grid-column: 1 / -1;
      padding: .75rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent-dark); }

    #error { color: var(--error); margin: 0 0 1rem; }
    #error:empty { display: none; }

    #lista { list-style: none; padding: 0; margin: 0; }
    #lista li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: .85rem 0;
      border-bottom: 1px solid var(--border);
    }
    #lista li:last-child { border-bottom: none; }
    #lista li.vacio { color: var(--muted); justify-content: center; }

    .nombre { font-weight: 600; }
    .detalle { color: var(--muted); font-size: .9rem; }

    .estado {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      padding: .25rem .6rem;
      border-radius: 999px;
      background: #f1e6dc;
      color: var(--accent-dark);
      white-space: nowrap;
    }

    @media (max-width: 520px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Reservas del restaurant</h1>
    <p>Reservá tu mesa en segundos</p>
  </header>


  <section class="card">
    <h2>Nueva reserva</h2>
    <form id="form">
      <label class="full">Nombre
        <input name="nombreCliente" placeholder="Juan Pérez" required />
      </label>
      <label>Teléfono
        <input name="telefono" placeholder="11 2345 6789" required />
      </label>
      <label>Personas
        <input name="cantidadPersonas" type="number" min="1" placeholder="2" required />
      </label>
      <label class="full">Fecha y hora
        <input name="fecha" type="datetime-local" required />
      </label>
      <button>Reservar</button>
    </form>
  </section>


  <p id="error"></p>

  <section class="card">
    <h2>Reservas</h2>
    <ul id="lista"></ul>
  </section>


  <script>
    const API = "http://localhost:4000/reservas";
    const lista = document.getElementById("lista");
    const errorEl = document.getElementById("error");


    async function cargar() {
      try {
        const res = await fetch(API);
        const reservas = await res.json();
        lista.innerHTML = "";
        if (reservas.length === 0) {
          const li = document.createElement("li");
          li.className = "vacio";
          li.textContent = "Todavía no hay reservas.";
          lista.appendChild(li);
        }
        for (const r of reservas) {
          const li = document.createElement("li");
          const fecha = new Date(r.fecha).toLocaleString("es-AR");

          const info = document.createElement("div");
          const nombre = document.createElement("div");
          nombre.className = "nombre";
          nombre.textContent = r.nombreCliente;
          const detalle = document.createElement("div");
          detalle.className = "detalle";
          detalle.textContent = `${r.cantidadPersonas} personas · ${fecha}`;
          info.append(nombre, detalle);

          const estado = document.createElement("span");
          estado.className = "estado";
          estado.textContent = r.estado;

          li.append(info, estado);
          lista.appendChild(li);
        }
        errorEl.textContent = "";
      } catch (e) {
        errorEl.textContent = "No se pudo conectar con la API. ¿Está corriendo el servidor?";
      }
    }


    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(e.target));
      datos.cantidadPersonas = Number(datos.cantidadPersonas);
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });
        if (!res.ok) throw new Error();
        e.target.reset();
        cargar();
      } catch {
        errorEl.textContent = "No se pudo crear la reserva.";
      }
    });


    cargar();
  </script>
</body>
</html>
